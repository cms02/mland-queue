plugins {
    id 'java'
    // 스프링 부트 버전을 3.2.x 이상으로 유지하신다면 아래 버전을 추천합니다.
    id 'org.springframework.boot' version '3.2.5'
    // 이 부분이 핵심입니다! 1.1.5 이상으로 올려주세요.
    id 'io.spring.dependency-management' version '1.1.5'
}
repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 필요한 다른 의존성들...
}

// 중요: 실행 메인 메서드가 없는 라이브러리형 모듈이므로 아래 설정이 필요합니다.
bootJar { enabled = false }
jar { enabled = true }